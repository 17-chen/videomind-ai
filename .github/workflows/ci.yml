name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://videomind:ci_test_only@localhost:5432/videomind
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: videomind
          POSTGRES_USER: videomind
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videomind -d videomind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Test backend
        run: python -m pytest -q
      - name: Lint backend
        run: ruff check app tests scripts
      - name: Check isolated hash retrieval baseline
        run: python -m scripts.evaluate_retrieval --provider local_hash --top-k 3 --min-recall 0.9 --output "$RUNNER_TEMP/retrieval-report.json" > /dev/null
      - name: Save retrieval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-report
          path: ${{ runner.temp }}/retrieval-report.json
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Check frontend types
        run: npm run typecheck
      - name: Lint frontend
        run: npm run lint
