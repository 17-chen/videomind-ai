name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Test backend
        run: python -m pytest -q
      - name: Lint backend
        run: ruff check app tests scripts
      - name: Check isolated hash retrieval baseline
        run: python -m scripts.evaluate_retrieval --provider local_hash --top-k 3 --min-recall 0.9 --output "$RUNNER_TEMP/retrieval-report.json" > /dev/null
      - name: Save retrieval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-report
          path: ${{ runner.temp }}/retrieval-report.json
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Check frontend types
        run: npm run typecheck
      - name: Lint frontend
        run: npm run lint
